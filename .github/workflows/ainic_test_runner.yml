# AINIC RCCL test runner — manual trigger only (non-gate).
#
# DEPLOYMENT: RCCL lives in the ROCm/rocm-systems monorepo at projects/rccl.
# The test_runner framework lives at
# projects/rccl/tools/scripts/test_runner/ and its entry point is test_runner.py
# (run from that directory so its `from lib...` imports resolve, matching the
# README). The AINIC A/B/C plan is configs/ainic_abc.json.
# It runs on the self-hosted org runner "tw-gfx950-ainic-ROCm-scale-runner"
# (org: ROCm). Adjust `runs-on` labels to match how that runner was registered.
#
# This workflow is intentionally NOT a merge gate: it has no pull_request trigger
# and its result does not block any PR. It exists so CI can drive the test runner
# on demand and collect results as artifacts.
#
# Push to the CI branch triggers a run for end-to-end pipeline testing before
# this workflow lands on develop. Remove once merged (same pattern as PR #7546).
#
# Build strategy (Group A vs Group B/C): the runner is a SLURM submit node with
# no local GPUs. Group A (configs/ainic_abc.json's gtest MPI component tests,
# binary rccl-UnitTestsMPI) needs a real RCCL build with --enable-mpi-tests,
# which that binary is compiled from. Group B/C (rccl-tests perf binaries) use a
# prebuilt, MPI-tests-less reference librccl.so for speed. Because a single
# test_runner.py invocation only has one active RCCL build dir for the whole
# process, this workflow builds RCCL fresh (with --enable-mpi-tests) from its
# own checkout *before* entering the SLURM allocation (compiling is CPU/toolchain
# work and shouldn't burn reserved GPU-node wall-clock time), then runs
# test_runner.py twice inside one salloc: once for Group A against that fresh
# build, once for Group B/C against the prebuilt reference library exactly as
# before.
name: AINIC RCCL Test Runner

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: 'Working directory on the runner for test artifacts/logs (WORKDIR)'
        required: false
        default: '/it-share/rccl-ci/rocm-systems'
      mpi_path:
        description: 'MPI install path (MPI_PATH)'
        required: false
        default: '/it-share/ompi-5.0.8'
      rocm_path:
        description: 'ROCm toolchain root (ROCM_PATH)'
        required: false
        default: '/it-share/rccl-ci/rocm_devel'
      rccl_build_dir:
        description: 'Pre-built RCCL lib dir containing librccl.so, used for Group B/C (RCCL_BUILD_DIR)'
        required: false
        default: '/it-share/rccl-ci/builds/reference/lib'
      test_suites:
        description: 'Comma-separated suite names to run (empty = all enabled; matched against test_suites[].name)'
        required: false
        default: ''
      salloc_partition:
        description: 'SLURM partition to allocate GPU nodes from'
        required: false
        default: 'amd-tw'
      salloc_reservation:
        description: 'SLURM reservation holding the AINIC GPU nodes'
        required: false
        default: 'rccl_dev'
      salloc_nodes:
        description: 'Number of GPU nodes to allocate'
        required: false
        default: '2'
      salloc_time:
        description: 'Max wall clock for the SLURM allocation (HH:MM:SS)'
        required: false
        default: '04:00:00'
      salloc_exclude:
        description: 'SLURM nodes to exclude from allocation (known-broken hardware)'
        required: false
        default: 'mia1-p01-g[24-25]'
  push:
    branches:
      - users/nikitaxgusev/ainic-test-runner
    paths:
      - '.github/workflows/ainic_test_runner.yml'
      - 'projects/rccl/tools/scripts/test_runner/configs/ainic_abc.json'

# Serialise on the shared AINIC nodes: only one run at a time, and never cancel
# an in-progress allocation (it must finish cleanly to release the nodes).
concurrency:
  group: ainic-test-runner-pinned-nodes
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Shared CI root on the AINIC cluster (configs, prebuilt libs, artifacts),
  # mirroring rccl_perf_regression.yml (PR #7546).
  RCCL_CI_ROOT: /it-share/rccl-ci
  TEST_RUNNER_DIR: projects/rccl/tools/scripts/test_runner
  DEFAULT_WORKDIR: /it-share/rccl-ci/rocm-systems
  DEFAULT_MPI_PATH: /it-share/ompi-5.0.8
  DEFAULT_ROCM_PATH: /it-share/rccl-ci/rocm_devel
  # Group B/C: prebuilt, MPI-tests-less reference librccl.so + prebuilt rccl-tests
  # perf binaries (all_reduce_perf, alltoall_perf, ...). Group A uses a fresh
  # --enable-mpi-tests build from this run's own checkout instead (see the
  # "Build RCCL" step and RCCL_TESTS_BIN override in "Run AINIC test suite").
  DEFAULT_RCCL_BUILD_DIR: /it-share/rccl-ci/builds/reference/lib
  DEFAULT_RCCL_TESTS_BIN: /it-share/rccl-ci/rccl-tests-2.30.4/bin
  # SLURM allocation defaults (used when the push trigger fires; workflow_dispatch
  # inputs override these). The self-hosted runner is a submit node without local
  # GPUs, so the suite must run inside a SLURM allocation on the AINIC GPU nodes.
  DEFAULT_SALLOC_PARTITION: amd-tw
  DEFAULT_SALLOC_RESERVATION: rccl_dev
  DEFAULT_SALLOC_NODES: '2'
  DEFAULT_SALLOC_TIME: '04:00:00'
  # Known-broken GPU nodes in the rccl_dev reservation: their inter-node RoCE
  # data path fails (socketProgress: connection closed), so exclude them.
  DEFAULT_SALLOC_EXCLUDE: 'mia1-p01-g[24-25]'

jobs:
  ainic-test-runner:
    runs-on: [self-hosted, tw-gfx950-ainic-ROCm-scale-runner]
    timeout-minutes: 540

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe runner environment (paths discovery)
        if: always()
        run: |
          echo "== whoami / host =="; whoami; hostname
          echo "== ROCm on PATH =="
          for b in rocminfo hipcc amdclang++ rocm_agent_enumerator; do
            echo -n "$b -> "; command -v "$b" || echo "(not found)"
          done
          echo "== /opt/rocm* =="; ls -ld /opt/rocm* 2>/dev/null || echo "(none)"
          echo "== other rocm roots =="; ls -ld /cluster/*rocm* /it-share/*rocm* 2>/dev/null || echo "(none)"
          echo "== ROCm-related env =="; env | grep -iE 'rocm|hip' || echo "(none)"
          echo "== module command =="; command -v module && (module avail 2>&1 | head -40) || echo "(no module)"
          echo "== /it-share/rccl-ci listing =="; ls -la /it-share/rccl-ci 2>/dev/null || echo "(missing)"
          echo "== librccl.so anywhere under /it-share/rccl-ci =="
          find /it-share/rccl-ci -maxdepth 3 -name 'librccl.so*' 2>/dev/null || echo "(none found)"
          echo "== MPI =="; ls -ld /it-share/ompi* 2>/dev/null; command -v mpirun || echo "(mpirun not on PATH)"

      - name: Build RCCL with MPI tests enabled (Group A, pre-salloc)
        id: build_rccl_mpi
        timeout-minutes: 120
        env:
          # Real build must come from this run's own checkout (guaranteed to match
          # the code under test and to be writable), not the shared scratch dir
          # used for artifacts/logs below.
          WORKDIR: ${{ github.workspace }}/projects/rccl
          MPI_PATH: ${{ github.event.inputs.mpi_path || env.DEFAULT_MPI_PATH }}
          ROCM_PATH: ${{ github.event.inputs.rocm_path || env.DEFAULT_ROCM_PATH }}
        run: |
          set -o pipefail
          # No RCCL_BUILD_DIR/RCCL_LIB_PATH/--build-dir here, so test_runner.py
          # actually invokes install.sh (build_configuration.install_flags in
          # ainic_abc.json already has --enable-mpi-tests). Compiling is
          # CPU/toolchain work -- do it here, on the submit node, before salloc,
          # so it doesn't burn reserved GPU-node wall-clock time. --skip-tests
          # turns this into a build-only pass (no SLURM allocation needed yet).
          cd "${GITHUB_WORKSPACE}/${TEST_RUNNER_DIR}"
          python3 test_runner.py \
            --config configs/ainic_abc.json \
            --system ainic \
            --skip-tests \
            2>&1 | tee "${RUNNER_TEMP}/ainic_build.log"
          rc=$?
          echo "== rccl-UnitTestsMPI =="
          ls -la "${WORKDIR}/build/debug/test/rccl-UnitTestsMPI" 2>&1 || true
          exit "${rc}"

      - name: Run AINIC test suite
        id: run_tests
        continue-on-error: true
        env:
          WORKDIR: ${{ github.event.inputs.workdir || env.DEFAULT_WORKDIR }}
          MPI_PATH: ${{ github.event.inputs.mpi_path || env.DEFAULT_MPI_PATH }}
          ROCM_PATH: ${{ github.event.inputs.rocm_path || env.DEFAULT_ROCM_PATH }}
          # Group B/C: unchanged prebuilt reference library + prebuilt perf binaries.
          GROUP_BC_RCCL_BUILD_DIR: ${{ github.event.inputs.rccl_build_dir || env.DEFAULT_RCCL_BUILD_DIR }}
          GROUP_BC_RCCL_TESTS_BIN: ${{ env.DEFAULT_RCCL_TESTS_BIN }}
          # Group A: fresh --enable-mpi-tests build produced by the step above.
          # librccl.so and test/rccl-UnitTestsMPI both live under build/debug (see
          # install.sh conventions), so the same dir covers RCCL_BUILD_DIR (used
          # for LD_LIBRARY_PATH + the librccl.so existence check) and, with
          # "/test" appended, RCCL_TESTS_BIN (paths.test_binary_dir, which
          # resolves the gtest binary name for tests that don't set their own
          # test_binary_dir -- see _resolve_binary_path Strategy 4 in
          # test_executor.py; this takes priority over the build-dir default, so
          # it must point at the fresh build for Group A to find its binary).
          GROUP_A_RCCL_BUILD_DIR: ${{ github.workspace }}/projects/rccl/build/debug
          TEST_SUITES: ${{ github.event.inputs.test_suites || '' }}
          SALLOC_PARTITION: ${{ github.event.inputs.salloc_partition || env.DEFAULT_SALLOC_PARTITION }}
          SALLOC_RESERVATION: ${{ github.event.inputs.salloc_reservation || env.DEFAULT_SALLOC_RESERVATION }}
          SALLOC_NODES: ${{ github.event.inputs.salloc_nodes || env.DEFAULT_SALLOC_NODES }}
          SALLOC_TIME: ${{ github.event.inputs.salloc_time || env.DEFAULT_SALLOC_TIME }}
          SALLOC_EXCLUDE: ${{ github.event.inputs.salloc_exclude || env.DEFAULT_SALLOC_EXCLUDE }}
        run: |
          set -o pipefail

          # Split TEST_SUITES (or default to "everything") into a Group A glob
          # and a Group B/C glob for --suite-name, since the two groups need
          # different RCCL_BUILD_DIR/RCCL_TESTS_BIN and must run as separate
          # test_runner.py invocations (its build dir is a single global value
          # for the whole process). All Group A test_suites entries are named
          # "A. Component - ..." in ainic_abc.json.
          GROUP_A_FILTER="A. Component*"
          GROUP_BC_FILTER="-A. Component*"
          RUN_GROUP_A=1
          RUN_GROUP_BC=1
          if [ -n "${TEST_SUITES}" ]; then
            GROUP_A_LIST=""
            GROUP_BC_LIST=""
            IFS=',' read -ra _suite_tokens <<< "${TEST_SUITES}"
            for tok in "${_suite_tokens[@]}"; do
              case "${tok}" in
                "A. Component"*) GROUP_A_LIST="${GROUP_A_LIST:+${GROUP_A_LIST}:}${tok}" ;;
                *)                GROUP_BC_LIST="${GROUP_BC_LIST:+${GROUP_BC_LIST}:}${tok}" ;;
              esac
            done
            if [ -n "${GROUP_A_LIST}" ]; then GROUP_A_FILTER="${GROUP_A_LIST}"; else RUN_GROUP_A=0; fi
            if [ -n "${GROUP_BC_LIST}" ]; then GROUP_BC_FILTER="${GROUP_BC_LIST}"; else RUN_GROUP_BC=0; fi
          fi

          # The self-hosted runner is a SLURM submit node without local GPUs, so
          # the suite must execute inside an allocation on the AINIC GPU nodes.
          # Inside the allocation SLURM_JOB_ID is set, test_runner calls
          # `scontrol show hostnames`, and mpirun lands 8 ranks/node on real GPUs.
          # --exclusive gives full CPUs per node so `--bind-to numa` has room.
          # test_runner.py resolves `from lib...` relative to its own directory,
          # so cd in first and use a config path relative to that directory.
          # One allocation is reused for both groups (Group A only asks mpirun
          # for 2 ranks out of it) to avoid double-queuing on the shared
          # reservation.
          RESV_ARG=""
          if [ -n "${SALLOC_RESERVATION}" ]; then
            RESV_ARG="--reservation=${SALLOC_RESERVATION}"
          fi
          EXCLUDE_ARG=""
          if [ -n "${SALLOC_EXCLUDE}" ]; then
            EXCLUDE_ARG="--exclude=${SALLOC_EXCLUDE}"
          fi

          export RUN_GROUP_A RUN_GROUP_BC GROUP_A_FILTER GROUP_BC_FILTER \
                 GROUP_A_RCCL_BUILD_DIR GROUP_BC_RCCL_BUILD_DIR GROUP_BC_RCCL_TESTS_BIN

          salloc \
            --partition="${SALLOC_PARTITION}" \
            ${RESV_ARG} \
            ${EXCLUDE_ARG} \
            --nodes="${SALLOC_NODES}" \
            --ntasks-per-node=8 \
            --gres=gpu:8 \
            --exclusive \
            --time="${SALLOC_TIME}" \
            bash -c '
              set -o pipefail
              cd "${GITHUB_WORKSPACE}/${TEST_RUNNER_DIR}"
              overall_rc=0

              if [ "${RUN_GROUP_A}" = "1" ]; then
                echo "================================================================"
                echo "Group A: gtest MPI component tests (fresh --enable-mpi-tests build)"
                echo "================================================================"
                RCCL_BUILD_DIR="${GROUP_A_RCCL_BUILD_DIR}" \
                RCCL_TESTS_BIN="${GROUP_A_RCCL_BUILD_DIR}/test" \
                python3 test_runner.py \
                  --config configs/ainic_abc.json \
                  --system ainic \
                  --no-build \
                  --suite-name "${GROUP_A_FILTER}" \
                  --report-suffix groupA \
                  2>&1 | tee "${RUNNER_TEMP}/ainic_run_groupA.log"
                rc=$?
                [ "${rc}" -ne 0 ] && overall_rc=1
              else
                echo "SKIP: Group A (no matching suites in --suite-name selection)"
              fi

              if [ "${RUN_GROUP_BC}" = "1" ]; then
                echo "================================================================"
                echo "Group B/C: rccl-tests perf binaries (prebuilt reference librccl.so)"
                echo "================================================================"
                RCCL_BUILD_DIR="${GROUP_BC_RCCL_BUILD_DIR}" \
                RCCL_TESTS_BIN="${GROUP_BC_RCCL_TESTS_BIN}" \
                python3 test_runner.py \
                  --config configs/ainic_abc.json \
                  --system ainic \
                  --no-build \
                  --suite-name "${GROUP_BC_FILTER}" \
                  --report-suffix groupBC \
                  2>&1 | tee "${RUNNER_TEMP}/ainic_run_groupBC.log"
                rc=$?
                [ "${rc}" -ne 0 ] && overall_rc=1
              else
                echo "SKIP: Group B/C (no matching suites in --suite-name selection)"
              fi

              exit "${overall_rc}"
            '

      - name: Upload run log and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ainic-test-report
          path: |
            ${{ runner.temp }}/ainic_build.log
            ${{ runner.temp }}/ainic_run_groupA.log
            ${{ runner.temp }}/ainic_run_groupBC.log
          if-no-files-found: ignore

      - name: Print summary
        if: always()
        run: |
          {
            echo '### AINIC RCCL Test Runner'
            for label_log in "Build (Group A, --enable-mpi-tests):${RUNNER_TEMP}/ainic_build.log" \
                              "Group A tests:${RUNNER_TEMP}/ainic_run_groupA.log" \
                              "Group B/C tests:${RUNNER_TEMP}/ainic_run_groupBC.log"; do
              label="${label_log%%:*}"
              log="${label_log#*:}"
              if [ -f "${log}" ]; then
                echo "#### ${label}"
                echo '```'
                # The runner prints a "Detailed Results" / "Total Tests" block at
                # the end; surface the tail of the log in the job summary.
                tail -n 60 "${log}"
                echo '```'
              fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
